name: inspect
on:
  push:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Dump Minecraft classes
        run: |
          for JAR in $(find ~/.gradle -name '*.jar' -size +20M | grep -i minecraft); do
            if unzip -l "$JAR" | grep -q 'com/mojang/blaze3d/platform/Window.class'; then
              echo "=============== JAR: $JAR"
              echo "----- Window: first 40 methods"
              javap -p -cp "$JAR" com.mojang.blaze3d.platform.Window | head -40 || true
              echo "----- renderFrame calls"
              javap -p -c -cp "$JAR" net.minecraft.client.Minecraft | awk '/public void renderFrame\(boolean\);/ {f=1} f && /invoke/ {print} f && /^$/ {exit}' || true
              echo "----- runTick calls (render-related)"
              javap -p -c -cp "$JAR" net.minecraft.client.Minecraft | awk '/private void runTick\(boolean\);/ {f=1} f && /invoke/ {print} f && /^$/ {exit}' | grep -iE 'render|frame|blit|present|swap|window' || true
              echo "----- classes that call glfwSwapBuffers"
              for cls in $(unzip -l "$JAR" | awk '{print $4}' | grep -E '^com/mojang/.*\.class$' | sed 's/\.class$//; s#/#.#g'); do
                javap -p -c -cp "$JAR" "$cls" 2>/dev/null | awk -v c="$cls" '/^  [a-z].*\);$/ {m=$0} /glfwSwapBuffers/ {print c " :: " m}' || true
              done
              echo "----- surface/backend classes"
              unzip -l "$JAR" | awk '{print $4}' | grep -iE 'GpuSurface|GlSurface|GpuBackend|Presenter|Vulkan' | head -40 || true
            fi
          done
          exit 0