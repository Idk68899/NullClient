name: inspect
on:
  push:
    paths:
      - ".github/workflows/inspect.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          pub() { javap -public -cp "$JAR" "$1" 2>/dev/null | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.network\.//g; s/net\.minecraft\.client\.//g; s/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g'; }
          fq() { unzip -l "$JAR" | awk '{print $4}' | grep -E "/$1\.class$" | head -1 | sed 's/\.class$//; s#/#.#g'; }
          show() { c=$(fq "$1"); if [ -n "$c" ]; then echo "--- $c"; pub "$c" | head -${2:-25}; else echo "--- $1: not found"; fi; }
          {
            echo "inspect of $JAR"
            printf '%s\n' '```'
            echo "===== SESSION EXTRA"
            show EventLoopGroupHolder 20
            show SimpleUnboundProtocol 14
            show UnboundProtocol 10
            show RegistryFriendlyByteBuf 14
            show ClientPacketListener 30
            show ServerboundSelectKnownPacks 6
            show ClientboundLoginPacket 8
            show ClientboundHelloPacket 8
            show LocalSampleLogger 8
            c=$(fq ClientGamePacketListener); echo "--- game listener names"; [ -n "$c" ] && pub "$c" | grep -E 'handleLogin|handleRespawn|handlePlayerPosition|handleDisconnect' | head -6
            echo "===== SKIN AND ICONS"
            show PlayerSkin 14
            show PlayerSkinWidget 10
            pub net.minecraft.client.gui.screens.inventory.InventoryScreen | grep -iE 'entity|player' | head -6
            pub net.minecraft.client.gui.GuiGraphicsExtractor | grep -E ' item\(|fakeItem|entity|pip|submit' | head -10
            printf '%s\n' '```'
          } > inspect.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "inspect-${{ github.run_number }}" --title "inspect ${{ github.run_number }}" \
            --notes-file inspect.txt --target "${{ github.sha }}"