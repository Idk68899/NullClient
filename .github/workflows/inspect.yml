name: inspect
on:
  push:
    paths:
      - ".github/workflows/inspect.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          pub() { javap -public -cp "$JAR" "$1" 2>/dev/null | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.network\.//g; s/net\.minecraft\.client\.//g; s/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g'; }
          fq() { unzip -l "$JAR" | awk '{print $4}' | grep -E "/$1\.class$" | head -1 | sed 's/\.class$//; s#/#.#g'; }
          show() { c=$(fq "$1"); if [ -n "$c" ]; then echo "--- $c"; pub "$c" | head -${2:-25}; else echo "--- $1: not found"; fi; }
          {
            echo "inspect of $JAR"
            printf '%s\n' '```'
            echo "===== NETWORKING (for sessions)"
            show Connection 60
            show ClientIntentionPacket 10
            show ClientIntent 8
            show ServerboundHelloPacket 10
            show ServerboundLoginAcknowledgedPacket 6
            show ClientLoginPacketListener 24
            show ClientHandshakePacketListenerImpl 14
            show ClientCommonPacketListenerImpl 40
            show ClientConfigurationPacketListener 40
            show ServerboundFinishConfigurationPacket 6
            show ServerboundKeepAlivePacket 6
            show ClientboundKeepAlivePacket 6
            show ClientboundPingPacket 6
            show ServerboundPongPacket 6
            show ServerboundMovePlayerPacket 14
            show ServerboundChatPacket 6
            show ServerboundClientInformationPacket 6
            show LoginProtocols 8
            show ConfigurationProtocols 8
            show GameProtocols 12
            show HandshakeProtocols 8
            show ProtocolInfo 10
            show PacketFlow 6
            show SharedConstants 14
            echo "--- ClientGamePacketListener method count"
            c=$(fq ClientGamePacketListener); [ -n "$c" ] && pub "$c" | grep -c 'void handle'
            echo "===== SKIN AND 3D MODEL (for the skin viewer)"
            pub net.minecraft.client.gui.GuiGraphicsExtractor | grep -iE 'entity|model|skin|player|pip|picture' | head -12
            pub net.minecraft.client.gui.screens.inventory.InventoryScreen | grep -iE 'entity|player|follows' | head -8
            show PlayerSkin 14
            pub net.minecraft.client.player.AbstractClientPlayer | grep -iE 'skin' | head -6
            printf '%s\n' '```'
          } > inspect.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "inspect-${{ github.run_number }}" --title "inspect ${{ github.run_number }}" \
            --notes-file inspect.txt --target "${{ github.sha }}"