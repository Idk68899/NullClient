name: inspect
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Dump account and multiplayer screen classes
        run: |
          for JAR in $(find ~/.gradle -name '*.jar' -size +20M | grep -i minecraft); do
            if unzip -l "$JAR" | grep -q 'com/mojang/blaze3d/platform/Window.class'; then
              echo "=============== JAR: $JAR"
              echo "----- Minecraft: user/session/screen members"
              javap -p -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'user|session|setScreen|screen\(' || true
              for NAME in 'client/User' 'ConnectScreen' 'DirectJoinServerScreen' 'JoinMultiplayerScreen' 'multiplayer/ServerData' 'multiplayer/ServerList' 'TitleScreen'; do
                for F in $(unzip -l "$JAR" | awk '{print $4}' | grep -E "net/minecraft/client/.*${NAME}\.class$" | head -3); do
                  CLS=$(echo "$F" | sed 's/\.class$//; s#/#.#g')
                  echo "----- $CLS"
                  javap -p -cp "$JAR" "$CLS" | head -70 || true
                done
              done
              echo "----- Screen / Button / EditBox members"
              javap -p -cp "$JAR" net.minecraft.client.gui.screens.Screen | grep -iE 'addRenderableWidget|init\(|rebuildWidgets|width|height' || true
              javap -p -cp "$JAR" net.minecraft.client.gui.components.Button | grep -iE 'builder|Builder|create' || true
              javap -p -cp "$JAR" net.minecraft.client.gui.components.EditBox | grep -iE 'setValue|getValue' || true
            fi
          done
          exit 0