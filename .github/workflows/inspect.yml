name: inspect
on:
  push:
    paths:
      - ".github/workflows/inspect.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Wiki samples
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          out = []
          for page in ["Iron_Pickaxe", "Shield", "Diamond_Boots", "Stick", "Bucket"]:
              url = "https://minecraft.wiki/api.php?action=parse&prop=wikitext&format=json&formatversion=2&redirects=1&page=" + urllib.parse.quote(page)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "NullClient/1.0 (Minecraft mod; recipe lookup)"})
                  data = json.load(urllib.request.urlopen(req, timeout=30))
                  w = data["parse"]["wikitext"]
                  if isinstance(w, dict):
                      w = w.get("*", "")
                  i = w.lower().find("{{crafting")
                  out.append("=== " + page + "\n" + (w[i:i + 700] if i >= 0 else "(no {{Crafting}} template found; first 300 chars) " + w[:300]))
              except Exception as e:
                  out.append("=== " + page + " ERROR " + repr(e))
          open("wiki.txt", "w").write("\n\n".join(out))
          PY
      - name: Classes
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          pub() { javap -public -cp "$JAR" "$1" 2>/dev/null | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.client\.//g; s/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g'; }
          {
            echo "inspect of $JAR"
            printf '%s\n' '```'
            echo "===== WIKI SAMPLES"
            cat wiki.txt
            echo
            echo "===== GameRenderer render/extract methods"
            pub net.minecraft.client.renderer.GameRenderer | grep -iE 'render|extract|level' | head -25
            echo "===== LevelRenderer render/extract methods"
            pub net.minecraft.client.renderer.LevelRenderer | grep -iE 'render|extract' | head -25
            echo "===== Camera"
            pub net.minecraft.client.Camera | head -30
            echo "===== Minecraft camera / render members"
            javap -public -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'camera|renderFrame|gameRenderer' | head -10
            echo "===== RemotePlayer / Entity constructors"
            pub net.minecraft.client.player.RemotePlayer | head -8
            echo "===== Fabric rendering api"
            for F in $(find ~/.gradle -name 'fabric-rendering*.jar' | head -2); do echo "-- $F"; unzip -l "$F" | awk '{print $4}' | grep -E 'client/rendering/v1/.*(Level|World|Hud)' | head -25; done
            printf '%s\n' '```'
          } > inspect.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "inspect-${{ github.run_number }}" --title "inspect ${{ github.run_number }}" \
            --notes-file inspect.txt --target "${{ github.sha }}"