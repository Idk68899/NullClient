name: inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon || true
      - name: Inspect
        run: |
          for JAR in $(find ~/.gradle -name '*.jar' -size +20M | grep -i minecraft); do
            if unzip -l "$JAR" | grep -q 'com/mojang/blaze3d/platform/Window.class'; then
              echo "##### BEGIN-INSPECT $JAR"
              show() { for F in $(unzip -l "$JAR" | awk '{print $4}' | grep -E "$1" | head -${2:-2}); do CLS=$(echo "$F" | sed 's/\.class$//; s#/#.#g'); echo "--- $CLS"; javap -public -cp "$JAR" "$CLS" | head -${3:-45}; done; }
              show 'net/minecraft/client/gui/Gui[A-Za-z]*Graphics[A-Za-z]*\.class$' 2 55
              show 'com/mojang/blaze3d/platform/NativeImage\.class$' 1 30
              show 'net/minecraft/client/renderer/texture/(DynamicTexture|TextureManager)\.class$' 2 25
              show 'net/minecraft/client/User\.class$' 1 20
              show 'net/minecraft/client/gui/screens/ConnectScreen\.class$' 1 20
              show 'net/minecraft/client/multiplayer/(ServerData|resolver/ServerAddress)\.class$' 2 25
              echo "--- Minecraft user/session members"
              javap -public -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'user|session' | head -10
              echo "##### END-INSPECT"
            fi
          done
          exit 0