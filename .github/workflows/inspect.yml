name: inspect
on:
  push:
    paths:
      - ".github/workflows/inspect.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sample minecraft-data
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          B = "https://raw.githubusercontent.com/PrismarineJS/minecraft-data/master/data/"
          out = []
          def say(s):
              out.append(str(s))
          def get(p):
              with urllib.request.urlopen(B + p, timeout=60) as r:
                  return json.load(r)
          v = "?"
          try:
              dp = get("dataPaths.json")["pc"]
              vers = [x for x in dp if re.fullmatch(r"\d+(\.\d+)*", x)]
              vers.sort(key=lambda x: tuple(int(n) for n in x.split(".")))
              say("newest versions: " + ", ".join(vers[-8:]))
              say("any 26.x: " + str([x for x in vers if x.startswith("26")]))
              v = vers[-1]
              say("using " + v)
              say("files for " + v + ": " + ", ".join(sorted(dp[v].keys())))
              def load(kind):
                  return get(dp[v][kind] + "/" + kind + ".json")
              blocks = load("blocks")
              for n in ("stone", "diamond_ore", "oak_log", "iron_ore"):
                  for b in blocks:
                      if b.get("name") == n:
                          say(json.dumps({k: b.get(k) for k in ("name", "hardness", "drops", "harvestTools", "material", "diggable")}))
              items = load("items")
              ids = {i["name"]: i["id"] for i in items}
              say("items: %d, sample %s" % (len(items), json.dumps(items[0])))
              recipes = load("recipes")
              say("recipes: %d" % len(recipes))
              say("iron_pickaxe recipe: " + json.dumps(recipes.get(str(ids.get("iron_pickaxe"))))[:600])
              for kind in ("entityLoot", "blockLoot", "foods", "entities"):
                  if kind in dp[v]:
                      try:
                          d = load(kind)
                          say("%s: %d entries, sample: %s" % (kind, len(d), json.dumps(d)[:500]))
                      except Exception as e:
                          say("%s failed: %s" % (kind, e))
                  else:
                      say(kind + ": not available for " + v)
          except Exception as e:
              say("ERROR: %r" % (e,))
          open("inspect.txt", "w").write("inspect of minecraft-data " + v + "\n```\n" + "\n".join(out) + "\n```\n")
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "inspect-${{ github.run_number }}" --title "inspect ${{ github.run_number }}" \
            --notes-file inspect.txt --target "${{ github.sha }}"